# fly.toml app configuration file generated for pulso-eleitoral on 2026-06-16T20:53:42-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulso-eleitoral'
primary_region = 'gru'

[build]

[env]
  FLASK_ENV = 'production'
  PORT = '8080'
  # Sem buffer no stdout: senão os print() só chegam ao flyctl logs no
  # desligamento do processo.
  PYTHONUNBUFFERED = '1'
  # O padrão do Waitress (4) enfileirava as chamadas do dashboard.
  WAITRESS_THREADS = '16'

[[mounts]]
  source = 'pulso_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Eleições 2026: máquina sempre ligada até o fim do 2º turno (25/10).
  # Depois, voltar para auto_stop_machines = 'stop' e min_machines_running = 0.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1